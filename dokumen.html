<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Dokumen | SEHATI</title>
    
    <script>
        // Pengecekan Keamanan & Autentikasi (Sama seperti dashboard.html)
        (function() {
            const isLoggedIn = sessionStorage.getItem('isLoggedIn');
            const allowedDomain = "alfan-23.github.io";
            const currentDomain = window.location.hostname;
            const isLocal = currentDomain === "localhost" || currentDomain === "127.0.0.1" || currentDomain === "";
            
            if (!isLoggedIn && !isLocal) {
                // Dimatikan sementara untuk pratinjau agar tidak redirect paksa
                // window.location.href = 'index.html'; 
            }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = { theme: { extend: { colors: { navy: '#1e293b', skyblue: '#38bdf8' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

    <!-- Navbar -->
    <header class="bg-navy text-white px-6 py-4 flex items-center justify-between shadow-md sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="text-slate-400 hover:text-white transition-colors bg-slate-800 p-2 rounded-lg">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div>
                <h1 class="font-bold text-lg text-skyblue leading-tight">Pusat Dokumen SEHATI</h1>
                <p class="text-xs text-slate-400">Akses file dan template akreditasi</p>
            </div>
        </div>
        <div class="text-[10px] bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full font-bold border border-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-user"></i> <span id="userRoleBadge">Loading...</span>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-8">
        
        <!-- Area Upload (Hanya untuk Dinkes) -->
        <div id="uploadSection" class="hidden mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-navy mb-4 border-b pb-2"><i class="fa-solid fa-cloud-arrow-up text-skyblue mr-2"></i> Unggah Dokumen Baru (Admin Dinkes)</h2>
            
            <div class="flex flex-col md:flex-row gap-4 items-end">
                <div class="flex-1 w-full">
                    <label class="block text-xs font-semibold text-slate-500 mb-2">Pilih File (Tanpa batas ukuran berkat Cloudinary)</label>
                    <input type="file" id="fileInput" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-skyblue/10 file:text-skyblue hover:file:bg-skyblue/20 cursor-pointer border border-slate-200 rounded-xl p-1 bg-slate-50">
                </div>
                <button id="btnUpload" class="w-full md:w-auto bg-navy hover:bg-slate-800 text-white px-6 py-3 rounded-xl font-bold text-sm transition-all shadow-md flex items-center justify-center gap-2">
                    <i class="fa-solid fa-upload"></i> Unggah File
                </button>
            </div>
            
            <!-- Progress Bar (Baru) -->
            <div id="progressContainer" class="hidden w-full mt-4">
                <div class="flex justify-between text-xs font-bold text-slate-500 mb-1">
                    <span>Sedang mengunggah ke brankas awan...</span>
                    <span id="progressText" class="text-skyblue">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2.5 border border-slate-200 overflow-hidden">
                    <div id="progressBar" class="bg-skyblue h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <p id="uploadStatus" class="text-sm text-emerald-600 mt-3 hidden font-medium"><i class="fa-solid fa-circle-check"></i> File berhasil diunggah!</p>
            <p id="uploadError" class="text-sm text-red-600 mt-3 hidden font-medium"><i class="fa-solid fa-triangle-exclamation"></i> Gagal mengunggah file.</p>
        </div>

        <!-- Daftar File -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-navy mb-6"><i class="fa-solid fa-folder-open text-amber-500 mr-2"></i> Daftar Dokumen Tersedia</h2>
            
            <div id="loadingIndicator" class="text-center py-12">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-skyblue mb-3"></i>
                <p class="text-slate-500 text-sm mt-2" id="loadingText">Menghubungkan ke server Firebase...</p>
            </div>

            <div id="emptyState" class="hidden text-center py-12 border-2 border-dashed border-slate-100 rounded-xl bg-slate-50">
                <i class="fa-solid fa-box-open text-4xl text-slate-300 mb-3"></i>
                <p class="text-slate-500 text-sm">Belum ada dokumen yang tersedia.</p>
            </div>

            <div id="fileList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 hidden">
                <!-- Data file akan di-render di sini oleh JavaScript -->
            </div>
        </div>
    </main>

    <!-- Firebase SDK (Tipe Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Deteksi apakah sedang berada di dalam lingkungan pratinjau (Canvas)
        const isCanvasPreview = typeof __firebase_config !== 'undefined';
        
        // =========================================================================
        // KREDENSIAL CLOUDINARY ANDA (SUDAH AKTIF)
        // =========================================================================
        const CLOUDINARY_CLOUD_NAME = "dinhwfi8q"; 
        const CLOUDINARY_UPLOAD_PRESET = "sehati_preset"; 
        // =========================================================================

        const manualFirebaseConfig = {
            apiKey: "AIzaSyAmFgLKiAkUF2ecChNyo8MQKlJOICscuRI",
            authDomain: "sehati-dokumen.firebaseapp.com",
            projectId: "sehati-dokumen",
            storageBucket: "sehati-dokumen.firebasestorage.app",
            messagingSenderId: "70559357101",
            appId: "1:70559357101:web:8c6cc9b3e11b7fc51f8e24"
        };

        // Jika di pratinjau, gunakan config sistem. Jika di GitHub, gunakan manualFirebaseConfig.
        const firebaseConfig = isCanvasPreview ? JSON.parse(__firebase_config) : manualFirebaseConfig;

        // Inisialisasi Firebase & Auth
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Path koleksi Firebase
        const appIdStr = typeof __app_id !== 'undefined' ? __app_id : 'demo-sehati';
        const collectionPath = isCanvasPreview ? `artifacts/${appIdStr}/public/data/shared_documents` : "shared_documents";

        // Ambil data sesi (Dari proses login index.html)
        const role = sessionStorage.getItem('kategori') || 'Fasyankes'; 
        const unitKerja = sessionStorage.getItem('unitKerja') || 'Admin Kab. Kuningan';
        
        document.getElementById('userRoleBadge').innerText = role + ' - ' + unitKerja;

        // Tampilkan fitur upload jika role adalah Dinkes
        if (role === 'Dinkes') {
            document.getElementById('uploadSection').classList.remove('hidden');
        }

        // --- Logika Firestore dimulai SETELAH autentikasi anonim berhasil ---
        signInAnonymously(auth).then(() => {
            
            const filesCollection = collection(db, collectionPath);
            const q = query(filesCollection, orderBy("timestamp", "desc"));
            
            // 1. Membaca Data (Realtime)
            onSnapshot(q, (snapshot) => {
                const listContainer = document.getElementById('fileList');
                const loading = document.getElementById('loadingIndicator');
                const empty = document.getElementById('emptyState');
                
                loading.classList.add('hidden');
                listContainer.innerHTML = ''; // Bersihkan list lama

                if (snapshot.empty) {
                    empty.classList.remove('hidden');
                    listContainer.classList.add('hidden');
                    return;
                }

                empty.classList.add('hidden');
                listContainer.classList.remove('hidden');

                snapshot.forEach((docSnap) => {
                    const file = docSnap.data();
                    const fileId = docSnap.id;
                    
                    const dateObj = file.timestamp ? file.timestamp.toDate() : new Date();
                    const dateStr = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                    
                    // Format Size yang lebih baik
                    let sizeStr = "0 KB";
                    if(file.size) {
                        const mb = file.size / (1024 * 1024);
                        if (mb > 1) sizeStr = mb.toFixed(2) + ' MB';
                        else sizeStr = (file.size / 1024).toFixed(1) + ' KB';
                    }

                    const card = document.createElement('div');
                    card.className = 'group border border-slate-200 bg-white rounded-xl p-4 flex flex-col hover:border-skyblue hover:shadow-md transition-all';
                    
                    let iconClass = 'fa-file text-slate-400';
                    if(file.type.includes('pdf')) iconClass = 'fa-file-pdf text-red-500';
                    else if(file.type.includes('image')) iconClass = 'fa-image text-blue-500';
                    else if(file.type.includes('word') || file.name.includes('.doc') || file.name.includes('.docx')) iconClass = 'fa-file-word text-blue-600';
                    else if(file.type.includes('excel') || file.name.includes('.xls') || file.name.includes('.xlsx')) iconClass = 'fa-file-excel text-emerald-500';

                    let deleteBtn = '';
                    if (role === 'Dinkes') {
                        deleteBtn = `<button onclick="window.hapusFile('${fileId}')" class="flex items-center justify-center bg-red-50 hover:bg-red-100 text-red-500 w-9 h-9 rounded-lg transition-colors border border-red-100" title="Hapus Data"><i class="fa-solid fa-trash-can"></i></button>`;
                    }

                    // Menambahkan flag "fl_attachment" pada URL Cloudinary agar file langsung terunduh, bukan terbuka di tab baru.
                    let downloadUrl = file.url;
                    if(downloadUrl && downloadUrl.includes('/upload/')) {
                        downloadUrl = downloadUrl.replace('/upload/', '/upload/fl_attachment/');
                    }

                    card.innerHTML = `
                        <div class="flex items-start gap-3 mb-4">
                            <div class="bg-slate-50 w-10 h-10 rounded-lg flex items-center justify-center shrink-0 border border-slate-100 shadow-sm">
                                <i class="fa-solid ${iconClass} text-xl"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-bold text-navy truncate" title="${file.name}">${file.name}</p>
                                <p class="text-[10px] text-slate-500 mt-1 uppercase tracking-wider font-semibold">${sizeStr} • ${dateStr}</p>
                            </div>
                        </div>
                        <div class="mt-auto flex items-center gap-2 pt-3 border-t border-slate-100">
                            <a href="${downloadUrl || '#'}" target="_blank" class="flex-1 flex items-center justify-center gap-2 bg-skyblue/10 hover:bg-skyblue text-skyblue hover:text-white py-2 rounded-lg text-xs font-bold transition-all border border-skyblue/20">
                                <i class="fa-solid fa-download"></i> Unduh File
                            </a>
                            ${deleteBtn}
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            }, (error) => {
                console.error("Firestore Permission Error:", error);
                document.getElementById('loadingIndicator').innerHTML = `<p class="text-red-500 font-bold"><i class="fa-solid fa-triangle-exclamation"></i> Gagal memuat data.</p><p class="text-xs text-slate-500 mt-2">Pastikan aturan Firestore Anda mengizinkan proses baca/tulis.</p>`;
            });

            // 2. Logika Upload File Menggunakan API Cloudinary
            document.getElementById('btnUpload').addEventListener('click', () => {
                const fileInput = document.getElementById('fileInput');
                const file = fileInput.files[0];
                const status = document.getElementById('uploadStatus');
                const error = document.getElementById('uploadError');
                const btn = document.getElementById('btnUpload');
                
                const progressContainer = document.getElementById('progressContainer');
                const progressBar = document.getElementById('progressBar');
                const progressText = document.getElementById('progressText');

                if (!file) return alert("Pilih file terlebih dahulu!");

                // Persiapan UI
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
                btn.disabled = true;
                status.classList.add('hidden');
                error.classList.add('hidden');
                
                progressContainer.classList.remove('hidden');
                progressBar.style.width = '0%';
                progressText.innerText = '0%';

                // Membuat Form Data untuk Cloudinary
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

                // Menggunakan XMLHttpRequest (XHR) agar kita bisa melihat Progress persentase
                const xhr = new XMLHttpRequest();
                xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, true);

                // Event ketika proses unggah berjalan
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percentComplete = Math.round((e.loaded / e.total) * 100);
                        progressBar.style.width = percentComplete + '%';
                        progressText.innerText = percentComplete + '%';
                    }
                };

                // Event ketika proses unggah selesai (sukses atau gagal)
                xhr.onload = async () => {
                    if (xhr.status === 200) {
                        // SUKSES UPLOAD KE CLOUDINARY
                        const response = JSON.parse(xhr.responseText);
                        const fileUrl = response.secure_url;
                        
                        try {
                            // Setelah sukses, simpan URL ke Database Firestore
                            await addDoc(filesCollection, {
                                name: file.name,
                                type: file.type || 'unknown',
                                size: file.size,
                                url: fileUrl, // <--- Ini yang penting, menyimpan URL asli Cloudinary
                                uploaderRole: role,
                                timestamp: serverTimestamp()
                            });
                            
                            fileInput.value = ''; 
                            status.classList.remove('hidden');
                            setTimeout(() => status.classList.add('hidden'), 4000);
                        } catch (err) {
                            console.error("Gagal simpan ke database:", err);
                            error.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Gagal menyimpan data ke Firestore.`;
                            error.classList.remove('hidden');
                        }

                    } else {
                        // GAGAL UPLOAD
                        console.error("Cloudinary Error:", xhr.responseText);
                        error.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Gagal mengunggah file ke Cloudinary.`;
                        error.classList.remove('hidden');
                    }

                    // Reset UI
                    btn.innerHTML = '<i class="fa-solid fa-upload"></i> Unggah File';
                    btn.disabled = false;
                    setTimeout(() => progressContainer.classList.add('hidden'), 1000);
                };

                // Event jika internet terputus
                xhr.onerror = () => {
                    error.innerHTML = `<i class="fa-solid fa-wifi"></i> Koneksi internet terputus saat mengunggah.`;
                    error.classList.remove('hidden');
                    btn.innerHTML = '<i class="fa-solid fa-upload"></i> Unggah File';
                    btn.disabled = false;
                    progressContainer.classList.add('hidden');
                };

                // Mulai Kirim
                xhr.send(formData);
            });

            // 3. Logika Hapus (Hanya menghapus data dari Firestore)
            window.hapusFile = async (id) => {
                if(confirm("Apakah Anda yakin ingin menghapus data dokumen ini dari daftar?")) {
                    try {
                        await deleteDoc(doc(db, collectionPath, id));
                    } catch(err) {
                        alert("Gagal menghapus file: " + err.message);
                    }
                }
            };

        }).catch((authError) => {
            console.error("Auth Error:", authError);
            document.getElementById('loadingIndicator').innerHTML = `<p class="text-red-500"><i class="fa-solid fa-triangle-exclamation"></i> Gagal terhubung ke sistem autentikasi.</p>`;
        });

    </script>
</body>
</html>
